<div class="max-w-md mx-auto p-6 bg-white shadow-md rounded-lg border border-gray-200 mt-6">
    <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-800 mb-6 text-center">Login</h1>

    <form #formlogin="ngForm" class="space-y-4">
        <!-- Usuario -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Usuario:</label>
            <input type="text" name="cajaUser" #cajauser
                class="w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-gray-800 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
        </div>

        <!-- Contraseña -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña:</label>
            <input type="password" name="cajaPass" #cajapass
                class="w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-gray-800 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
        </div>

        <!-- Botón de Login (Estilo Warning / Amarillo tipo Bootstrap) -->
        <button type="button" (click)="login()"
            class="w-full py-2.5 px-4 bg-yellow-400 text-gray-900 font-medium rounded-lg shadow-sm hover:bg-yellow-500 active:bg-yellow-600 transition-colors text-sm mt-2">
            Login
        </button>
    </form>

    <!-- Mensaje dinámico -->
    @if (mensaje != "") {
    <div class="mt-4 p-3 bg-gray-50 border border-gray-200 rounded-lg text-center text-sm font-medium text-gray-700">
        {{ mensaje }}
    </div>
    }
</div>
