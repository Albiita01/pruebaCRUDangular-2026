<div class="max-w-xl mx-auto p-6 bg-white shadow-md rounded-lg border border-gray-200 mt-6">
    <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-800 mb-6">Editar coche</h1>

    @if (coche) {
    <form #createform="ngForm" (ngSubmit)="updateCoche()" class="space-y-4">
        <!-- ID (Desactivado) -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">ID:</label>
            <input [value]="coche.idCoche" name="cajaId" #cajaid type="number" disabled
                class="w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded-lg text-gray-500 text-sm cursor-not-allowed" />
        </div>

        <!-- Marca -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Marca:</label>
            <input [value]="coche.marca" name="cajaMarca" #cajamarca type="text"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-yellow-500 focus:outline-none text-sm" />
        </div>

        <!-- Modelo -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Modelo:</label>
            <input [value]="coche.modelo" name="cajaModelo" #cajamodelo type="text"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-yellow-500 focus:outline-none text-sm" />
        </div>

        <!-- Conductor -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Conductor:</label>
            <input [value]="coche.conductor" name="cajaConductor" #cajaconductor type="text"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-yellow-500 focus:outline-none text-sm" />
        </div>

        <!-- Imagen (Vista previa + Input File) -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Imagen actual:</label>
            <div class="mb-3 flex items-center gap-4">
                <img [src]="coche.imagen" alt="Imagen actual del coche"
                    class="w-24 h-16 object-cover rounded-md border border-gray-200 shadow-sm" />
                <span class="text-xs text-gray-500">Selecciona un archivo nuevo solo si deseas cambiar la foto.</span>
            </div>

            <label class="block text-sm font-medium text-gray-700 mb-1">Nueva imagen:</label>
            <input name="cajaImagen" #cajaimagen type="file" accept="image/*"
                class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-yellow-50 file:text-yellow-800 hover:file:bg-yellow-100 cursor-pointer border border-gray-300 rounded-lg p-1" />
        </div>

        <!-- Botón Actualizar -->
        <div class="pt-4">
            <button type="submit"
                class="w-full py-2.5 px-4 bg-yellow-400 text-gray-900 font-medium rounded-lg shadow-md hover:bg-yellow-500 transition-colors text-sm">
                Modificar coche
            </button>
        </div>
    </form>
    } @else {
    <div class="flex justify-center items-center py-10 text-gray-500">
        <p>Cargando datos del coche...</p>
    </div>
    }
</div>
