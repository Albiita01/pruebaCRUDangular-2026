<nav class="w-full border-b border-gray-200 bg-white">

        <a routerLink="/" class="text-xl font-semibold whitespace-nowrap">Coches</a>

        <!-- Añadimos 'items-center' aquí para alinear verticalmente todos los elementos del menú -->

            <li>
                <a routerLink="/" routerLinkActive="text-blue-600" [routerLinkActiveOptions]="{ exact: true }"

            </li>
            <li>
                <a routerLink="/create" routerLinkActive="text-blue-600" class="hover:text-blue-600">Create</a>

            <li>
                <p style="color: skyblue;">{{user.userName}}</p>

                <button type="button" (click)="logout()"

            </li>
            } @else {
            <li>
                <a routerLink="/login" routerLinkActive="bg-blue-800"
                    class="px-4 py-2 bg-blue-600 text-white font-medium text-sm rounded-lg shadow-sm hover:bg-blue-700 active:bg-blue-800 transition-colors inline-block text-center">

        </ul>
