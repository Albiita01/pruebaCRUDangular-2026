<div class="max-w-xl mx-auto p-6 bg-white shadow-md rounded-lg border border-gray-200 mt-6">
    <h1 class="text-2xl sm:text-3xl font-extrabold text-red-600 mb-2">Borrar coche</h1>
    <p class="text-sm text-gray-500 mb-6">¿Estás seguro de que deseas eliminar este registro?</p>

    @if (coche) {
    <form #createform="ngForm" class="space-y-4">
        <!-- ID -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">ID:</label>
            <input [value]="coche.idCoche" type="number" name="cajaId" #cajaid disabled
                class="w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded-lg text-gray-500 text-sm cursor-not-allowed" />
        </div>

        <!-- Marca -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Marca:</label>
            <input [value]="coche.marca" type="text" name="cajaMarca" #cajamarca disabled
                class="w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded-lg text-gray-500 text-sm cursor-not-allowed" />
        </div>

        <!-- Modelo -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Modelo:</label>
            <input [value]="coche.modelo" type="text" name="cajaModelo" #cajamodelo disabled
                class="w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded-lg text-gray-500 text-sm cursor-not-allowed" />
        </div>

        <!-- Conductor -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Conductor:</label>
            <input [value]="coche.conductor" type="text" name="cajaConductor" #cajaconductor disabled
                class="w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded-lg text-gray-500 text-sm cursor-not-allowed" />
        </div>

        <!-- Vista previa opcional de la imagen -->
        <div class="mt-2">
            <img [src]="coche.imagen" alt="Imagen del coche"
                class="w-24 h-16 object-cover rounded-md border border-gray-200 shadow-sm" />
        </div>

        <!-- Botones de Acción -->
        <div class="flex gap-4 pt-4">
            <button type="button" (click)="confirmDeleteAsync()"
                class="w-1/2 py-2.5 px-4 bg-red-600 text-white font-medium rounded-lg shadow-md hover:bg-red-700 transition-colors text-sm">
                Sí, eliminar
            </button>
            <button type="button" (click)="cancelar()"
                class="w-1/2 py-2.5 px-4 bg-gray-200 text-gray-700 font-medium rounded-lg shadow-md hover:bg-gray-300 transition-colors text-sm">
                Cancelar
            </button>
        </div>

        <!-- Mensaje de éxito estilizado con Tailwind -->
        @if (mensaje != "") {
        <div class="p-4 bg-green-50 border-l-4 border-green-500 text-green-700 rounded-r-md text-sm font-medium mt-4">
            {{ mensaje }}
        </div>
        }
    </form>
    } @else {
    <div class="flex justify-center items-center py-10 text-gray-500">
        <p>Cargando datos del coche...</p>
    </div>
    }
</div>
