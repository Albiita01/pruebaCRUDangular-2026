<div class="max-w-xl mx-auto p-6 bg-white shadow-md rounded-lg border border-gray-200 mt-6">
    <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-800 mb-6">Añadir coche</h1>

    <form class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Marca:</label>
            <input name="cajaMarca" #cajamarca type="text"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm" />
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Modelo:</label>
            <input name="cajaModelo" #cajamodelo type="text"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm" />
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Conductor:</label>
            <input name="cajaConductor" #cajaconductor type="text"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm" />
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Imagen:</label>
            <input name="cajaImagen" #cajaimagen type="file" accept="image/*"
                class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer border border-gray-300 rounded-lg p-1" />
        </div>

        @if (mensaje) {
        <div class="p-3 bg-red-50 border-l-4 border-red-500 text-red-700 rounded-r-md text-sm">
            {{ mensaje }}
        </div>
        }

        <div class="pt-4">
            <button type="button" (click)="insertCoche()"
                class="w-full py-2.5 px-4 bg-blue-600 text-white font-medium rounded-lg shadow-md hover:bg-blue-700 transition-colors text-sm">
                Guardar coche
            </button>
        </div>
    </form>
</div>
